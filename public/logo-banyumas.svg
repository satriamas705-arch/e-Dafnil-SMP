<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Shield / Circle -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Base Circle / Border -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#eab308" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="url(#skyGrad)"/>

  <!-- Mountain (Gunung Slamet) -->
  <polygon points="100,45 155,115 45,115" fill="#1e293b"/>
  <polygon points="100,45 130,115 70,115" fill="#334155"/>
  <polygon points="100,45 110,75 90,75" fill="#94a3b8" opacity="0.6"/>

  <!-- River (Sungai Serayu) -->
  <path d="M 45,115 Q 100,110 155,115 L 155,130 Q 100,138 45,130 Z" fill="#0284c7"/>
  <path d="M 50,122 Q 100,128 150,122" stroke="#e0f2fe" stroke-width="2" fill="none"/>

  <!-- Banyan Tree (Pohon Beringin) -->
  <ellipse cx="100" cy="92" rx="32" ry="24" fill="#15803d"/>
  <ellipse cx="88" cy="85" rx="18" ry="16" fill="#16a34a"/>
  <ellipse cx="112" cy="85" rx="18" ry="16" fill="#16a34a"/>
  <ellipse cx="100" cy="78" rx="20" ry="16" fill="#22c55e"/>
  <!-- Trunk -->
  <rect x="96" y="98" width="8" height="18" fill="#78350f" rx="2"/>

  <!-- Padi & Kapas Wreath -->
  <!-- Left: Padi (Golden Rice) -->
  <path d="M 40,140 C 25,100 35,65 60,45" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>
  <circle cx="34" cy="115" r="3" fill="#eab308"/>
  <circle cx="33" cy="98" r="3" fill="#eab308"/>
  <circle cx="37" cy="82" r="3" fill="#eab308"/>
  <circle cx="45" cy="68" r="3" fill="#eab308"/>
  <circle cx="56" cy="56" r="3" fill="#eab308"/>

  <!-- Right: Kapas (Cotton) -->
  <path d="M 160,140 C 175,100 165,65 140,45" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="166" cy="115" r="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="167" cy="98" r="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="163" cy="82" r="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="155" cy="68" r="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="144" cy="56" r="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Golden Star on Top -->
  <polygon points="100,22 104,32 115,32 106,39 109,50 100,43 91,50 94,39 85,32 96,32" fill="url(#goldGrad)"/>

  <!-- Red Ribbon at Bottom with Text "BANYUMAS" -->
  <path d="M 35,145 L 60,140 L 140,140 L 165,145 L 155,165 L 100,162 L 45,165 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="100" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#ffffff" letter-spacing="1.5">BANYUMAS</text>

  <!-- Motto Banner -->
  <path d="M 50,168 Q 100,178 150,168 L 145,178 Q 100,186 55,178 Z" fill="#ffffff" stroke="#eab308" stroke-width="1"/>
  <text x="100" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="5" fill="#1e293b">RARASING RASA WIWARA PRAJA</text>
</svg>
